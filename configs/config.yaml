dataset:
  name: rossmann          # rossmann | m5
  raw_dir: data/raw
  processed_dir: data/processed

database:
  driver: mysql
  host: 127.0.0.1
  port: 3307
  name: demandcast
  user: demandcast
  password_env: MYSQL_PASSWORD   # kept in the ignored root .env, never in YAML

date_col: date
target_col: sales
id_cols: [store_id, item_id]     # granularity of the base series

split:
  train_end: "2015-06-19"
  valid_end: "2015-07-17"        # single chronological validation window
  test_end: "2015-08-14"

features:
  lags: [7, 14, 28]
  rolling_windows: [7, 14, 28, 90]
  use_promo: true
  use_holidays: true
  use_calendar: true

model:
  gru:
    enabled: false           # opt in: python run_pipeline.py --only gru dashboard
    lookback: 56
    horizon: 14
    hidden_size: 32
    layers: 1
    dropout: 0.1
    learning_rate: 0.001
    batch_size: 256
    epochs: 12
    patience: 3
    training_days: 180
    max_samples: 30000
    threads: 4
    seed: 42

  lightgbm:
    objective: tweedie
    tweedie_variance_power: 1.1
    num_leaves: 128
    learning_rate: 0.03
    n_estimators: 3000
    early_stopping_rounds: 100
    min_child_samples: 30
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    seed: 42

  sarima:
    order: [1, 1, 1]
    seasonal_order: [1, 1, 1, 7]

  prophet:
    weekly_seasonality: true
    yearly_seasonality: true
    holidays: true
    country: DE  # ISO country code for holiday calendar (e.g. DE, US, GB)

reconciliation:
  method: bottom_up        # bottom_up only; mint raises NotImplementedError
  hierarchy: [item_id, store_id, region]

evaluation:
  metric: wmape
  output_dir: reports
